<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Courier</title>
    <link rel="stylesheet" href="request-courier.css">
</head>
<body>
    <div class="navbar">
        <img src="logo.png" alt="Logo" class="logo">
        <ul class="nav-links">
            <li><a href="home.html">Home</a></li>
            <li><a href="product.html">Products</a></li>
            <li><a href="about_us.html">About Us</a></li>
            <li><a href="seller.html" class="active">Seller</a></li>
        </ul>
        <div class="nav-icons">
            <a href="e-wallet.html" class="icon" data-tooltip="E-wallet">
                <img src="wallet.png" alt="E-wallet">
            </a>
            <a href="cart.html" class="icon" data-tooltip="Cart">
                <img src="cart.jpg" alt="Cart">
            </a>
            <a href="profile.html" class="icon" data-tooltip="Profile">
                <img src="profile.jpg" alt="Profile">
            </a>
        </div>
    </div>
    <div class="request-courier">
        <h1>Request Courier</h1>
        <form>
            <label for="order-id">Order ID:</label>
            <input type="text" id="order-id" name="order-id" placeholder="Enter Order ID">

            <label for="product-name">Product Name:</label>
            <input type="text" id="product-name" name="product-name" placeholder="Enter Product Name">

            <label for="quantity">Quantity:</label>
            <input type="number" id="quantity" name="quantity" placeholder="Enter Quantity">

            <label for="seller-address">Seller Address:</label>
            <input type="text" id="seller-address" name="seller-address" placeholder="Enter Seller Address">

            <label for="buyer-address">Buyer Address:</label>
            <input type="text" id="buyer-address" name="buyer-address" placeholder="Enter Buyer Address">

            <label>Choose Courier Service:</label>
            <div class="courier-options">
                <label class="courier-option">
                    <input type="radio" name="courier" value="fedex">
                    <img src="fedex-logo.png" alt="FedEx">
                    <span>FedEx</span>
                </label>
                <label class="courier-option">
                    <input type="radio" name="courier" value="ups">
                    <img src="ups-logo.png" alt="UPS">
                    <span>UPS</span>
                </label>
                <label class="courier-option">
                    <input type="radio" name="courier" value="dhl">
                    <img src="dhl-logo.png" alt="DHL">
                    <span>DHL</span>
                </label>
                <label class="courier-option">
                    <input type="radio" name="courier" value="usps">
                    <img src="usps-logo.png" alt="USPS">
                    <span>USPS</span>
                </label>
            </div>

            <button type="submit">Request Courier</button>
        </form>
    </div>
</body>
</html>
