<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>
    <link rel="stylesheet" href="cart.css">
</head>
<body>
    <div class="navbar">
        <img src="../Seller UI/logo2 copy.png" alt="Logo" class="logo">
        <ul class="nav-links">
            <li><a href="../Seller UI/home.html" >Home</a></li>
            <li><a href="../Seller UI/product.html">Products</a></li>
            <li><a href="../Seller UI/about_us.html">About Us</a></li>
            <li><a href="approved.html" class="active">Seller</a></li>
        </ul>
        <div class="nav-icons">
            <a href="../Seller UI/e-wallet.html" class="icon" data-tooltip="E-wallet">
                <img src="../Seller UI/wallet.png" alt="E-wallet">
            </a>
            <a href="../Seller UI/cart.html" class="icon" data-tooltip="Cart">
                <img src="../Seller UI/cart.jpg" alt="Cart">
            </a>
            <a href="../Seller UI/profile.html" class="icon" data-tooltip="Profile">
                <img src="../Seller UI/profile.jpg" alt="Profile">
            </a>
        </div>
        <div class="menu-btn" id="menu-btn">
            <div class="menu-icon"></div>
            <div class="menu-icon"></div>
            <div class="menu-icon"></div>
            <div class="menu-links" id="menu-links">
              <a href="about_us.html#contact" class="contact-us-btn">Contact Us</a>
            </div>
            </div>
    </div>

    <div class="cart-content">
        <h1>Your Shopping Cart</h1>
        <table>
            <tr>
                <th>Product</th>
                <th>Price</th>
                <th>Quantity</th>
                <th>Total</th>
                <th>Action</th>
            </tr>
            <!-- product rows -->
            <tr>
                <td>Product 1</td>
                <td>$50</td>
                <td><input type="number" value="1" min="1"></td>
                <td>$50</td>
                <td><button class="remove-btn">Remove</button></td>
            </tr>
        </table>

        <div class="cart-summary">
            <p>Total Price: $150</p>
            <button class="checkout-btn">Proceed to Checkout</button>
        </div>
    </div>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
          const cartTable = document.querySelector("table");
          const cart = JSON.parse(localStorage.getItem("cart")) || [];
          const cartSummary = document.querySelector(".cart-summary p");
          const checkoutButton = document.querySelector(".checkout-btn");
      
          // Function to render cart items
          const renderCart = () => {
            let totalPrice = 0;
            cartTable.innerHTML = `
              <tr>
                <th>Product</th>
                <th>Image</th>
                <th>Price</th>
                <th>Quantity</th>
                <th>Total</th>
                <th>Action</th>
              </tr>
            `;
      
            cart.forEach((item, index) => {
              const row = document.createElement("tr");
              const itemTotal = item.price * item.quantity;
              totalPrice += itemTotal;
      
              row.innerHTML = `
                <td>${item.name}</td>
                <td><img src="${item.image}" alt="${item.name}" style="width: 50px; height: 50px;" /></td>
                <td>$${item.price.toFixed(2)}</td>
                <td>
                  <input type="number" value="${item.quantity}" min="1" data-index="${index}" />
                </td>
                <td>$${itemTotal.toFixed(2)}</td>
                <td>
                  <button class="remove-btn" data-index="${index}">Remove</button>
                </td>
              `;
      
              cartTable.appendChild(row);
            });
      
            cartSummary.textContent = `Total Price: $${totalPrice.toFixed(2)}`;
          };
      
          // Update quantity
          cartTable.addEventListener("change", (e) => {
            if (e.target.type === "number") {
              const index = e.target.dataset.index;
              cart[index].quantity = parseInt(e.target.value);
              localStorage.setItem("cart", JSON.stringify(cart));
              renderCart();
            }
          });
      
          // Remove item
          cartTable.addEventListener("click", (e) => {
            if (e.target.classList.contains("remove-btn")) {
              const index = e.target.dataset.index;
              cart.splice(index, 1);
              localStorage.setItem("cart", JSON.stringify(cart));
              renderCart();
            }
          });
      
          // Proceed to checkout
          checkoutButton.addEventListener("click", () => {
            if (cart.length === 0) {
              alert("Your cart is empty!");
            } else {
              alert("Proceeding to checkout!");
            }
          });
      
          renderCart();
        });
      </script>      
</body>
</html>
