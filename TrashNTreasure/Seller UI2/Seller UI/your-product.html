<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Products</title>
    <link rel="stylesheet" href="your-product.css">
</head>
<body>
    <div class="navbar">
        <img src="../Seller UI/logo2 copy.png" alt="Logo" class="logo">
        <ul class="nav-links">
            <li><a href="../Seller UI/home.html" >Home</a></li>
            <li><a href="../Seller UI/product.html">Products</a></li>
            <li><a href="../Seller UI/about_us.html">About Us</a></li>
            <li><a href="approved.html" class="active">Seller</a></li>
        </ul>
        <div class="nav-icons">
            <a href="../Seller UI/e-wallet.html" class="icon" data-tooltip="E-wallet">
                <img src="../Seller UI/wallet.png" alt="E-wallet">
            </a>
            <a href="../Seller UI/cart.html" class="icon" data-tooltip="Cart">
                <img src="../Seller UI/cart.jpg" alt="Cart">
            </a>
            <a href="../Seller UI/profile.html" class="icon" data-tooltip="Profile">
                <img src="../Seller UI/profile.jpg" alt="Profile">
            </a>
        </div>
        <div class="menu-btn" id="menu-btn">
            <div class="menu-icon"></div>
            <div class="menu-icon"></div>
            <div class="menu-icon"></div>
            <div class="menu-links" id="menu-links">
              <a href="about_us.html#contact" class="contact-us-btn">Contact Us</a>
            </div>
            </div>
    </div>
    <div class="product-content">
        <h1>Your Products</h1>
        <button class="add-product-btn" id="addProductBtn">Add New Product</button>
        <div class="product-list" id="productList">
            <!-- Example product -->
            <div class="product-item">
                <img src="../Seller UI/tshirt.png" alt="Product" class="product-img">
                <div class="product-info">
                    <h3 class="product-name">Product Name</h3>
                    <p class="product-price">Price: $50</p>
                    <div class="product-actions">
                        <button class="edit-btn">Edit</button>
                        <button class="remove-btn">Remove</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Add a new product to the list
        document.getElementById('addProductBtn').addEventListener('click', function() {
            const productList = document.getElementById('productList');
            
            // Create new product item
            const newProduct = document.createElement('div');
            newProduct.classList.add('product-item');

            // Add default content for the new product
            newProduct.innerHTML = `
                <img src="../Seller UI/tshirt.png" alt="Product" class="product-img">
                <div class="product-info">
                    <h3 class="product-name" contenteditable="true">New Product</h3>
                    <p class="product-price" contenteditable="true">Price: $0</p>
                    <div class="product-actions">
                        <button class="edit-btn">Edit</button>
                        <button class="remove-btn">Remove</button>
                    </div>
                </div>
            `;

            // Add new product to the product list
            productList.appendChild(newProduct);

            // Add event listeners for new product buttons
            addProductActions(newProduct);
        });

        // Edit or remove product
        function addProductActions(productItem) {
            const editButton = productItem.querySelector('.edit-btn');
            const removeButton = productItem.querySelector('.remove-btn');

            // Remove product when remove button is clicked
            removeButton.addEventListener('click', function() {
                productItem.remove();
            });

            // Make product name, price, and image editable
            editButton.addEventListener('click', function() {
                const productName = productItem.querySelector('.product-name');
                const productPrice = productItem.querySelector('.product-price');
                const productImg = productItem.querySelector('.product-img');

                // Toggle contenteditable
                const isEditable = productName.isContentEditable;
                productName.contentEditable = !isEditable;
                productPrice.contentEditable = !isEditable;
                productImg.contentEditable = !isEditable;
                
                // Change the button text based on whether the product is editable
                if (isEditable) {
                    editButton.textContent = 'Edit';
                } else {
                    editButton.textContent = 'Save';
                }
            });
        }

        // Initialize product actions for existing products
        document.querySelectorAll('.product-item').forEach(productItem => {
            addProductActions(productItem);
        });
    </script>
</body>
</html>
