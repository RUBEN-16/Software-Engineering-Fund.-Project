<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home - Trash and Treasure</title>
    <link rel="stylesheet" href="../Seller UI/home.css" />
  </head>
  <body>
    <!-- Header Section -->
    <header>
      <div class="navbar">
        <img src="../Seller UI/logo2 copy.png" alt="Logo" class="logo" />
        <ul class="nav-links">
          <li><a href="../Seller UI/home.html">Home</a></li>
          <li><a href="../Seller UI/product.html">Products</a></li>
          <li><a href="../Seller UI/about_us.html">About Us</a></li>
        </ul>

        <a href="../Seller UI/login_signup.html" class="login-btn">Login</a>

        <div class="menu-btn" id="menu-btn">
          <div class="menu-icon"></div>
          <div class="menu-icon"></div>
          <div class="menu-icon"></div>
          <div class="menu-links" id="menu-links">
            <a href="../Seller UI/profile.html">Profile</a>
            <a href="about_us.html#contact" class="contact-us-btn">Contact Us</a>
          </div>
        </div>
      </div>
    </header>

    <!-- Hero Section -->
    <section class="hero">
      <h1>Welcome to Trash and Treasure</h1>
      <p>
        Where sustainability meets opportunity. Explore treasures, sell
        pre-loved items, and make a difference!
      </p>
      <a href="product.html">
        <button class="explore-btn">Explore Now</button>
      </a>
    </section>

    <!-- Sliding Images Section -->
    <section class="sliding-images">
        <div class="slider-container">
            <!-- Left Arrow Button -->
            <button class="arrow-btn left-arrow" onclick="moveSlide(-1)">&#9664;</button>

            <!-- Slider -->
            <div class="slider">
                <img class="slider-img" src="../Seller UI/image1.jpg" alt="Image 1" loading="lazy">
                <img class="slider-img" src="../Seller UI/image3.jpg" alt="Image 3" loading="lazy">
                <img class="slider-img" src="../Seller UI/image6.jpg" alt="Image 6" loading="lazy">
                <img class="slider-img" src="../Seller UI/image7.jpg" alt="Image 7" loading="lazy">
                <img class="slider-img" src="../Seller UI/t&t.jpg" alt="t&t" loading="lazy">
            </div>

            <!-- Right Arrow Button -->
            <button class="arrow-btn right-arrow" onclick="moveSlide(1)">&#9654;</button>
        </div>

        <!-- vertically aligned images -->
        <div class="right-images">
            <img src="../Seller UI/image4.jpg" alt="Image 4" loading="lazy">
            <img src="../Seller UI/image5.jpg" alt="Image 5" loading="lazy">
        </div>
    </section>

    <script src="home.js"></script>

    <!-- Footer Section -->
    <footer>
      <div class="footer-content">
        <p>&copy; 2024 Trash and Treasure. All Rights Reserved.</p>
        <ul class="footer-links">
          <li><a href="#">Privacy Policy</a></li>
          <li><a href="#">Terms of Service</a></li>
          <li><a href="#">Contact Us</a></li>
        </ul>
      </div>
    </footer>

    <script>
      const menuBtn = document.getElementById("menu-btn");
      const menuLinks = document.getElementById("menu-links");

      menuBtn.addEventListener("click", () => {
        menuLinks.classList.toggle("show");
      });

      let currentSlide = 0;

function showSlide(index) {
    const slides = document.querySelectorAll(".slider-img");
    const totalSlides = slides.length;
    const sliderWidth = document.querySelector(".slider-container").offsetWidth;

    // Loop back to the first slide if index exceeds total slides
    if (index >= totalSlides) currentSlide = 0;
    // Loop to the last slide if index is less than 0
    if (index < 0) currentSlide = totalSlides - 1;

    // Calculate the offset to slide the images
    const offset = -currentSlide * sliderWidth;
    document.querySelector(".slider").style.transform = `translateX(${offset}px)`;
}

function moveSlide(step) {
    currentSlide += step;
    showSlide(currentSlide);
}

// Initialide the first slide
showSlide(currentSlide);

    </script>
  </body>
</html>
