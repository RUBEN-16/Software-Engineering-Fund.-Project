<div class="notify-modal">
    <h2>Notify Seller</h2>
    <form action="{{ url_for('admin.send_notification_to_seller', product_id=product.id) }}" method="post">
       <textarea name="message" rows="4" placeholder="Enter your message here" required></textarea>
        <div class="modal-button">
           <button type="submit" class="send-btn">Send</button>
            <button type="button" class="back-btn" onclick="closeModal()">Back</button>
        </div>
     </form>
</div>
