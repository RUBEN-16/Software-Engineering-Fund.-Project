

{% extends "index.html" %}
{% block title %} Login Page {%endblock%}
{%block content%}


<div class="form-box">
    <div class="register-container" id="register">
        <div class="top">
            <span>Have an account? <a href="#" onclick="">Login</a></span>
            <header>Sign Up</header>
        </div>
        <div class="two_forms">
            <div class="input-box">
                <input type="text" class="input-field" placeholder="First Name">
                <i class="bx bx-user"></i>
            </div>
            <div class="input-box">
                <input type="text" class="input-field" placeholder="Last Name">
                <i class="bx bx-user"></i>
            </div>
        </div>
        <div class="input-box">
            <input type="email" class="input_field" placeholder="Email">
            <i class="bx bx-envelope"></i>
        </div>
        <div class="input-box">
            <input type="password" class="input_field" placeholder="Password">
            <i class="bx bx-lock-alt"></i>
        </div>
        <div class="input-box">
            <input type="submit" class="submit" placeholder="Register">
\        </div>
        
    </div>
</div>
{%endblock%}
