<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdminLogin Page</title>
</head>
<body>
    <link rel="stylesheet" href="/static/login_extended.css">
    <div class="msg">
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }}">
                <span>{{ message }}</span>
                <button class="close-btn" onclick="this.parentElement.style.display='none';">×</button>
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}
    </div>
    <div class="container">
        <form action="{{url_for('admin.login')}}" method='post'>
            <div class="top">
                <header><h1>Admin Log In</h1></header>
            </div>
            <div class="form-group">
                <input type="text" name="username" placeholder="Userame" required>
            </div>
            <br>
            <div class="form-group">
                <input type="password" name="password" placeholder="Password" required>
            </div>
            <br>
            <div class="form-group">
                <center><p><input type="submit" name="action" value="Login" ></p></center>
                <center><p><input type="submit" name="action" value="Back" formnovalidate></p></center>
                
            </div>
        </form>
    </div>
    
</body>
</html>
