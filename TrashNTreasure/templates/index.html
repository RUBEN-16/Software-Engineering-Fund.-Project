  <!DOCTYPE html>
  <html lang="en">
    <head>
        
        <title>{%block title%}Home{%endblock%}</title>
        <link rel="stylesheet" href="/static/navi.css">
    </head>
    <body>   
        <!-- Header Section -->
      <header class="header">
        <div class="logo">
            <a href="/">
                <img src="/static/images/logo2.png" alt="LOGO" href="/"/>
            </a>
        </div> 
        <!-- Navigation Bar -->
      <nav class="navbar">
        <ul>
          <li><a href="/">Home</a></li>
          <li><a href="/aboutus">About Us</a></li>
          <li><a href="/product">Product</a></li>
          <li><a href="{{url_for("seller.wanna_be_seller")}}">Seller?</a></li>
        </ul>
      </nav>
        <div class="menu">
          <ul>
            {% if not session.get('user_name') %}
              <div class="login">
                <li><a href="/login">Log In</a></li>
              </div>
            {%else%}
              <div class="cart">
                <p>$0.00</p>
                <img src="../static/images/cart.png" alt="Profile">
              </div>
              
            {%endif%}
            <div class="dropdown-btn" id="dropdown-btn">
              <div class="dropdown-icon"></div>
              <div class="dropdown-icon"></div>
              <div class="dropdown-icon"></div>
              <div class="dropdown-links" id="dropdown-links">
                <a href="{{url_for("user.user_page")}}">My Account</a>
                <a href="/contact">Contact</a>
                <a href="">Help</a>
                {% if session.get('user_name') %}
                  <a href="{{url_for('user.logout')}}">Logout</a>  
                {%endif%}
              </div>
            </div>
        </div>
      </header>
 
    {%block content%}
    {%endblock%}

    </body>
  </html>
