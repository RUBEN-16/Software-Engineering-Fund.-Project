<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - T&T(Logistic)</title>
  <link rel="stylesheet" href="/static/login_extended.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
{% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="msg">
        {% for category, message in messages %}
          <div class="alert alert-{{ category }}">
            <span>{{ message }}</span>
            <button class="close-btn" onclick="this.parentElement.style.display='none';">×</button>
          </div>
        {% endfor %}
        </div> 
      {% endif %}
    {% endwith %}

  <script>
  document.addEventListener('DOMContentLoaded', function() {
    const alertMessages = document.querySelectorAll('.alert');

    alertMessages.forEach(function(alert) {
      setTimeout(function() {
        alert.classList.add('fade-out');
        setTimeout(function() {
          alert.style.display = 'none';
        }, 500); // Match the transition duration
      }, 3000); // 3 seconds delay
    });
  });
  </script>
<body>
  <div class="login-container">
    <div class="login-box">
      <div class="login-header">
        <i class="fas fa-truck-moving"></i>
        <h1>LogisticsPro</h1>
        <p>Welcome back! Please login to access your dashboard.</p>
      </div>
      <form class="login-form" action="{{url_for('logistic.login')}}" method='post'>
        <div class="input-group">
          <i class="fas fa-envelope"></i>
          <input type="email" name="email" placeholder="Enter your email" required>
        </div>
        <div class="input-group">
          <i class="fas fa-lock"></i>
          <input type="password" name="password" placeholder="Enter your password" required>
        </div>
        <button type="submit" name="submit" class="login-btn">Login</button>
        <div class="login-footer">
          <a href="#">Forgot Password?</a>
          <a href="{{url_for("login")}}">Back</a>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
